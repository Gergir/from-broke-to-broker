services:
  app-frontend:
    container_name: app-frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - app

  app:
    container_name: app
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    env_file:
      - backend/.env
    depends_on:
      - db

  db:
    container_name: db
    image: postgres:15
    ports:
      - "5432:5432"
    env_file:
      - backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
